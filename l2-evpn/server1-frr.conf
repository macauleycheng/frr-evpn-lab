! L2 EVPN - Server1 (vtysh 格式)
! 由 common/lab.sh 在容器内以 vtysh -f 套用
!
router bgp 6500
 ! router-id 填本容器 IP
 bgp router-id 10.99.0.11
 ! neighbor 填对端 IP(Server2),同 AS 6500 即 iBGP
 neighbor 10.99.0.12 remote-as 6500
 !
 address-family l2vpn evpn
  neighbor 10.99.0.12 activate
  ! 自动为本机所有 VXLAN(VNI)通告 type-2/type-3 route
  advertise-all-vni
 exit-address-family
exit
!
