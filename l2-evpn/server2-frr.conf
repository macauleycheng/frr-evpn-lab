! L2 EVPN - Server2 (vtysh 格式)
! 由 common/lab.sh 在容器內以 vtysh -f 套用
!
router bgp 6500
 ! router-id 填本容器 IP
 bgp router-id 10.99.0.12
 ! neighbor 填對端 IP(Server1),同 AS 6500 即 iBGP
 neighbor 10.99.0.11 remote-as 6500
 !
 address-family l2vpn evpn
  neighbor 10.99.0.11 activate
  advertise-all-vni
 exit-address-family
exit
!
