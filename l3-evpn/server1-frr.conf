! L3 EVPN (symmetric IRB) - Server1 (vtysh 格式)
! 由 common/lab.sh 在容器內以 vtysh -f 套用
!
! 將 VRF vrf1 對應到 L3 VNI 3000
vrf vrf1
 vni 3000
exit-vrf
!
router bgp 6500
 ! router-id 填本容器 IP(原筆記誤寫成對端 IP)
 bgp router-id 10.99.0.11
 ! neighbor 填對端 IP(原筆記誤寫成自己)
 ! 本例為 iBGP(同 AS 6500),不需要 no bgp ebgp-requires-policy;
 ! 只有改用 eBGP(不同 AS)時才需要加上該指令。
 neighbor 10.99.0.12 remote-as 6500
 !
 address-family l2vpn evpn
  neighbor 10.99.0.12 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 6500 vrf vrf1
 !
 address-family ipv4 unicast
  ! 將 vrf1 內的直連網段(10.0.0.0/24、11.0.0.0/24)匯入 BGP
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  ! 以 EVPN type-5 通告 vrf1 的 IPv4 unicast 路由
  advertise ipv4 unicast
 exit-address-family
exit
!
