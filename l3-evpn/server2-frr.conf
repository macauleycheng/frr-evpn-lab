! L3 EVPN (symmetric IRB) - Server2 (vtysh 格式)
! 由 common/lab.sh 在容器内以 vtysh -f 套用
!
! 将 VRF vrf1 对应到 L3 VNI 3000
vrf vrf1
 vni 3000
exit-vrf
!
router bgp 6500
 ! router-id 填本容器 IP(原笔记误写成对端 IP)
 bgp router-id 10.99.0.12
 ! neighbor 填对端 IP
 ! 本例为 iBGP(同 AS 6500),不需要 no bgp ebgp-requires-policy;
 ! 只有改用 eBGP(不同 AS)时才需要加上该指令。
 neighbor 10.99.0.11 remote-as 6500
 !
 address-family l2vpn evpn
  neighbor 10.99.0.11 activate
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
router bgp 6500 vrf vrf1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
exit
!
